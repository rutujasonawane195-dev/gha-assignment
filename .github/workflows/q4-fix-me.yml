name: Conditional Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  APP_NAME: demo-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: ${{ inputs.environment == 'production' }}

    steps:
      - name: Print target
        run: echo "Deploying $APP_NAME to ${{ inputs.environment }}"

      - name: Guarded step
        if: ${{ env.APP_NAME == 'demo-app' }}
        run: echo "guard passed"

      - name: Notify
        if: ${{ success() }}
        run: echo "finished"
