name: Q1 Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "2.0.0"
        type: string

      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest

    outputs:
      build_tag: ${{ steps.release.outputs.build_tag }}
      build_date: ${{ steps.release.outputs.build_date }}

    steps:
      - name: Generate release information
        id: release
        run: |
          BUILD_TAG="v${{ inputs.version }}-${{ inputs.release_type }}-${{ github.run_number }}"
          BUILD_DATE=$(date +%Y-%m-%d)

          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          echo "Build tag: $BUILD_TAG"
          echo "Build date: $BUILD_DATE"

  announce:
    name: Announce Release
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Print outputs
        run: |
          echo "Build tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build date: ${{ needs.prepare.outputs.build_date }}"

      - name: Create summary
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | Release Type | Build Tag | Build Date |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ inputs.version }} | ${{ inputs.release_type }} | ${{ needs.prepare.outputs.build_tag }} | ${{ needs.prepare.outputs.build_date }} |" >> "$GITHUB_STEP_SUMMARY"
